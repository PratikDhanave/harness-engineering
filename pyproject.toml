[project]
name = "harness"
version = "0.1.0"
description = "Local-first agent-harness practice project (Lessons 1-7): guardrails, durable execution, sandboxing, memory, routing, supervision, human-in-the-loop"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.7",
    "agent-framework-core>=1.15,<2",
    "agent-framework-openai>=1.14,<2",
    "agent-framework-orchestrations>=1.1,<2",
    "foundry-local-sdk==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

# The stack is local-first and tracks current stable. It used to be pinned to
# 1.0.0rc6 because `agent-framework-azure-ai` has never shipped past that rc and
# breaks on any newer core (it imports BaseContextProvider, which core renamed to
# ContextProvider). Dropping the Azure client — this repo runs on Foundry Local —
# removed that ceiling and unlocked `agent-framework-orchestrations`, which needs
# core >= 1.15 and brings HandoffBuilder / ConcurrentBuilder / MagenticBuilder.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Agent Framework is async throughout, so the lessons wired to it have
# async tests. Marker-based (not auto) so nothing existing changes behaviour.
asyncio_mode = "strict"
