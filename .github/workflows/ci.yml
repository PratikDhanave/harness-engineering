name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      # The whole suite is deterministic and cloud-free: every Azure dependency
      # sits behind a seam with a local implementation, so no secrets are needed.
      - name: Run tests
        run: uv run --extra dev pytest -q
